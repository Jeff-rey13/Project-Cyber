name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: control-plane/requirements.txt

      - name: install
        run: pip install -r control-plane/requirements.txt ruff==0.8.4

      - name: lint
        run: ruff check control-plane target-plane scripts

      - name: lab (paired exploit/fix tests)
        working-directory: target-plane/nimbus-air
        run: python -m pytest -q tests

      - name: control plane (>= 85% overall)
        working-directory: control-plane
        run: python -m pytest -q tests --cov=app --cov-report=term --cov-fail-under=85

      - name: scope package (>= 95%, safety-critical)
        working-directory: control-plane
        # same coverage data as the step above, just a stricter bar on the gate's package
        run: python -m coverage report --include="app/scope/*" --fail-under=95

      - name: control matrix in sync
        working-directory: control-plane
        run: python -m app.compliance.mapper | diff - ../compliance/control-matrix.md
